name: 🔨 Manual Test Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Patch App for Testing
        run: |
          # 1. Change the InAppUpdater URL to the Test-px repo
          sed -i 's|https://api.github.com/repos/atappu805/PixelMusic/releases/latest|https://api.github.com/repos/Test-px/PixelMusic/releases/latest|g' app/src/main/java/com/unshoo/pixelmusic/utils/InAppUpdater.kt

          # 2. Change the Application ID in build.gradle.kts
          sed -i 's/applicationId = "com.unshoo.pixelmusic"/applicationId = "com.unshoo.pixelmusic.test"/g' app/build.gradle.kts
          
          # 3. Change App Name to strictly "Test" (Using wildcard to ensure it catches it regardless of formatting)
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Test<\/string>/g' app/src/main/res/values/strings.xml

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload to Testing Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: Test-px/PixelMusic
          token: ${{ secrets.TEST_REPO_PAT }}
          tag_name: test-build-${{ github.run_number }}
          name: Test Build ${{ github.run_number }}
          body_path: changelog.txt
          files: app/build/outputs/apk/release/*.apk

