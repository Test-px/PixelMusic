name: 🐞 Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" || \
            sdkmanager "platform-tools" "platforms;android-36" || \
            echo "Falling back to AGP auto-SDK download"

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔐 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🛠️ Build debug APK (arm64-v8a only)
        run: ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace --no-daemon

      - name: 🔍 Diagnostic - list produced APKs
        if: always()
        run: |
          echo "=== APK files under app/build ==="
          find app/build -type f -name "*.apk" -print 2>/dev/null || echo "None found"

      - name: 📤 Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-debug-${{ github.sha }}
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 📎 Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
