name: 🐞 Debug Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" || \
            sdkmanager "platform-tools" "platforms;android-36" || \
            echo "Falling back to AGP auto-SDK download"

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔐 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🛠️ Build debug APK (arm64-v8a only)
        run: ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace --no-daemon

      - name: 🔍 Diagnostic - where is the APK?
        if: always()
        run: |
          echo "========================================="
          echo "1) Any .apk in the whole workspace:"
          echo "========================================="
          find . -type f -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "========================================="
          echo "2) Contents of app/build (max 4 levels):"
          echo "========================================="
          find app/build -maxdepth 4 -type d 2>/dev/null || echo "app/build does not exist"

          echo ""
          echo "========================================="
          echo "3) Does app/build/outputs exist?"
          echo "========================================="
          ls -la app/build/outputs 2>/dev/null || echo "NO — app/build/outputs missing"

          echo ""
          echo "========================================="
          echo "4) Does app/build/outputs/apk exist?"
          echo "========================================="
          ls -la app/build/outputs/apk 2>/dev/null || echo "NO — app/build/outputs/apk missing"

          echo ""
          echo "========================================="
          echo "5) Contents of app/build/outputs/apk/debug (if any):"
          echo "========================================="
          find app/build/outputs/apk/debug -type f 2>/dev/null || echo "NO — folder missing"

          echo ""
          echo "========================================="
          echo "6) Gradle's build-results.json:"
          echo "========================================="
          find /home/runner/work/_temp -name "build-results-*.json" -exec cat {} \; 2>/dev/null || true

          echo ""
          echo "========================================="
          echo "7) Any APK anywhere on the runner:"
          echo "========================================="
          find /home/runner -type f -name "*.apk" 2>/dev/null | head -n 50 || true

          echo ""
          echo "=== DONE ==="

      - name: 📤 Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelMusic-debug-${{ github.sha }}
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 📎 Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
