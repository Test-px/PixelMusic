name: 🚀 Auto Release Build (Dual-Repo)

on:
  workflow_dispatch: 

env:
  # 🎯 The secondary public repository where APKs will also be published
  TARGET_REPO: 'Saurav-02/PixelMusic'

jobs:
  build:
    name: 🛠️ Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit the version bump and create local releases

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔑 Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: 📈 Increment Version Code (+1) & Name (+0.5)
        id: versioning
        run: |
          # 1. Grab the current code and name from gradle.properties
          BASE_CODE=$(grep "^APP_VERSION_CODE=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          RAW_NAME=$(grep "^APP_VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          
          # 2. Clean up messy versions (e.g., "2.0.0.8" becomes "2.0")
          BASE_NAME=$(echo "$RAW_NAME" | grep -oE '^[0-9]+(\.[0-9]+)?')
          if [[ ! "$BASE_NAME" == *.* ]]; then
            BASE_NAME="${BASE_NAME}.0"
          fi
          
          # 3. Calculate new values (+1 Code, +0.5 Name)
          NEW_CODE=$((BASE_CODE + 1))
          NEW_NAME=$(awk "BEGIN {printf \"%.1f\", $BASE_NAME + 0.5}")
          
          # 4. Set Tag Name
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            NEW_NAME=${TAG_NAME#v}
          else
            TAG_NAME="v${NEW_NAME}"
          fi
          
          # 5. Update the gradle.properties file locally
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${NEW_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${NEW_NAME}/" gradle.properties
          
          # 6. Save to environment variables for later steps
          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_ENV
          echo "NEW_NAME=${NEW_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 🔨 Build Release APK
        # If this step fails, the workflow stops here and NOTHING is pushed!
        run: ./gradlew :app:assembleRelease

      - name: 💾 Commit & Push Version Bump (To Source Repo)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add gradle.properties
          git commit -m "chore: bump version to v${{ env.NEW_NAME }} (Code: ${{ env.NEW_CODE }}) [skip ci]" || echo "No changes to commit"
          git push

      - name: 📝 Read Release Notes from File
        run: |
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          if [ -f changelog.txt ]; then
            cat changelog.txt >> $GITHUB_ENV
          else
            echo "✨ New update available. See repository for details." >> $GITHUB_ENV
          fi
          echo -e "\n\n---\n*📦 Current Version Code: ${{ env.NEW_CODE }}*" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 🧹 Delete Previous Releases and Tags (From SOURCE Repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q ".[].tagName" | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "💥 Wiping out old release and tag from source: $tag"
              gh release delete "$tag" --cleanup-tag -y
            fi
          done

      - name: 🧹 Delete Previous Releases and Tags (From TARGET Repo)
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          gh release list -R ${{ env.TARGET_REPO }} --limit 100 --json tagName -q ".[].tagName" | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "💥 Wiping out old release and tag from target: $tag"
              gh release delete "$tag" -R ${{ env.TARGET_REPO }} --cleanup-tag -y
            fi
          done

      - name: 🚀 Create GitHub Release & Upload APK (To SOURCE Repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create GitHub Release & Upload APK (To TARGET Repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: app/build/outputs/apk/release/*.apk

      - name: 📦 Upload Signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 📱 app-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
