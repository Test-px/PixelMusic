name: 🚀 Final Release Build (Dual-Repo)

on:
  workflow_dispatch:

env:
  TARGET_REPO: 'Saurav-02/PixelMusic'

permissions:
  contents: write

concurrency:
  group: final-release
  cancel-in-progress: false

jobs:
  build:
    name: 🛠️ Build Signed Release APK & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔑 Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: 📈 Increment Version Code (+1) & Name (Jump to next .5)
        id: versioning
        run: |
          BASE_CODE=$(grep "^APP_VERSION_CODE=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          RAW_NAME=$(grep "^APP_VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')

          BASE_NAME=$(echo "$RAW_NAME" | grep -oE '^[0-9]+(\.[0-9]+)?')
          if [[ ! "$BASE_NAME" == *.* ]]; then
            BASE_NAME="${BASE_NAME}.0"
          fi

          NEW_CODE=$((BASE_CODE + 1))

          # Final release: snap to next 0.5 milestone
          # 4.0 → 4.5 | 4.1 → 4.5 | 4.4 → 4.5 | 4.5 → 5.0 | 4.9 → 5.0 | 5.0 → 5.5
          NEW_NAME=$(awk "BEGIN {printf \"%.1f\", (int($BASE_NAME * 2) + 1) / 2.0}")

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            NEW_NAME=${TAG_NAME#v}
          else
            TAG_NAME="v${NEW_NAME}"
          fi

          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${NEW_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${NEW_NAME}/" gradle.properties

          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_ENV
          echo "NEW_NAME=${NEW_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          echo "🎯 Final release: v$BASE_NAME → v$NEW_NAME (Code: $BASE_CODE → $NEW_CODE)"

      - name: 🔨 Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 🔍 Diagnostic - list produced APKs
        if: always()
        run: |
          echo "=== APK files under app/build ==="
          find app/build -type f -name "*.apk" -print 2>/dev/null || echo "None found"

      - name: 💾 Commit & Push Version Bump (To Source Repo)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          git commit -m "chore: release v${{ env.NEW_NAME }} (Code: ${{ env.NEW_CODE }}) [skip ci]" || echo "No changes to commit"
          git push

      - name: 📝 Read Release Notes from File
        run: |
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          if [ -f changelog.txt ]; then
            cat changelog.txt >> $GITHUB_ENV
          else
            echo "✨ New update available. See repository for details." >> $GITHUB_ENV
          fi
          echo -e "\n\n---\n*📦 Current Version Code: ${{ env.NEW_CODE }}*" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 🧹 Delete Previous Releases and Tags (From SOURCE Repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+' \
            | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "💥 Deleting old source release: $tag"
                  gh release delete "$tag" --cleanup-tag -y || true
                fi
              done

      - name: 🧹 Delete Previous Releases and Tags (From TARGET Repo)
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          gh release list -R ${{ env.TARGET_REPO }} --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+' \
            | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "💥 Deleting old target release: $tag"
                  gh release delete "$tag" -R ${{ env.TARGET_REPO }} --cleanup-tag -y || true
                fi
              done

      - name: 🚀 Create GitHub Release & Upload APK (To SOURCE Repo)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            app/build/outputs/apk/release/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create GitHub Release & Upload APK (To TARGET Repo)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: 🌟 Release ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: '**/*.apk'

      - name: 📦 Upload Signed Release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-${{ env.TAG_NAME }}
          path: |
            app/build/outputs/apk/release/**/*.apk
          retention-days: 14
