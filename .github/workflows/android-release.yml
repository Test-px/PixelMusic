name: Android Release Build

on:
  workflow_dispatch: 
  push:
    tags:
      - 'v*' 

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v5
        with:
          # This enables the build-cache across GitHub Actions runs
          cache-read-only: ${{ github.ref != 'refs/heads/main' }} 

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build Release APK (arm64-v8a)
        # Added memory allocation to prevent R8 Garbage Collection bottleneck
        env:
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC"
        run: ./gradlew :app:assembleRelease -Pabi=arm64-v8a --build-cache --parallel

      - name: Upload Signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          
