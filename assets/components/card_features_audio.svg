<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="⚡ Direct CDN Streaming Engine">
  <defs>
    <linearGradient id="cardGrad_High-FidelityAudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E142B" />
      <stop offset="100%" stop-color="#3D1A39" />
    </linearGradient>
  </defs>

  <!-- Big Component Container -->
  <rect x="2" y="2" width="916" height="256" rx="32" fill="url(#cardGrad_High-FidelityAudio)" stroke="#ECCBD9" stroke-width="1.8" />

  <!-- Scalloped Badge -->
  <g transform="translate(56, 52)">
    
    <g transform="translate(0, 0)">
      <rect x="-24" y="-24" width="48" height="48" rx="13.44" fill="#EBBFE0" transform="rotate(0)" />
      <rect x="-24" y="-24" width="48" height="48" rx="13.44" fill="#EBBFE0" transform="rotate(30)" />
      <rect x="-24" y="-24" width="48" height="48" rx="13.44" fill="#EBBFE0" transform="rotate(60)" />
    </g>
  
    <!-- Sparkle / Star Icon -->
    <path d="M 0,-8 L 2.5,-2.5 L 8,0 L 2.5,2.5 L 0,8 L -2.5,2.5 L -8,0 L -2.5,-2.5 Z" fill="#2E172B" />
  </g>

  <!-- Header Section -->
  <g transform="translate(100, 38)">
    <text x="0" y="14" fill="#EBBFE0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">HIGH-FIDELITY AUDIO</text>
    <text x="0" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">⚡ Direct CDN Streaming Engine</text>
  </g>

  <!-- Expressive Spec Pills -->
  <g transform="translate(56, 88)">
    
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#4A2E46" stroke="#ECCBD9" stroke-width="1.2" />
      <text x="77.5" y="18.5" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">Zero HTTP 403</text>
    </g>
  
    <g transform="translate(165, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#4A2E46" stroke="#ECCBD9" stroke-width="1.2" />
      <text x="77.5" y="18.5" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">160 kbps Opus</text>
    </g>
  
    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#4A2E46" stroke="#ECCBD9" stroke-width="1.2" />
      <text x="77.5" y="18.5" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">DualPlayer Preload</text>
    </g>
  
    <g transform="translate(495, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#4A2E46" stroke="#ECCBD9" stroke-width="1.2" />
      <text x="77.5" y="18.5" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">Live Bitrate Tag</text>
    </g>
  
  </g>

  <!-- Bullet Items in Rounded Component Box -->
  <g transform="translate(56, 132)">
    <rect x="0" y="0" width="808" height="106" rx="20" fill="#1C0B1B" stroke="#ECCBD9" stroke-width="1.2" opacity="0.9" />
    
      <g transform="translate(24, 26)">
        <!-- Scalloped mini bullet -->
        <circle cx="0" cy="0" r="4" fill="#EBBFE0" />
        <text x="14" y="4" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          <tspan font-weight="700">Bypasses YouTube 403 Bans:</tspan> Resolves directly to unencrypted GoogleVideo CDN streams without tracking.
        </text>
      </g>
    
      <g transform="translate(24, 50)">
        <!-- Scalloped mini bullet -->
        <circle cx="0" cy="0" r="4" fill="#EBBFE0" />
        <text x="14" y="4" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          <tspan font-weight="700">Instant Gapless Transitions:</tspan> DualPlayer engine pre-buffers next queue tracks in background memory.
        </text>
      </g>
    
      <g transform="translate(24, 74)">
        <!-- Scalloped mini bullet -->
        <circle cx="0" cy="0" r="4" fill="#EBBFE0" />
        <text x="14" y="4" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          <tspan font-weight="700">Dynamic Adaptive Bitrate:</tspan> Intelligent auto-switching between cellular and high-bitrate Wi-Fi profiles.
        </text>
      </g>
    
  </g>
</svg>