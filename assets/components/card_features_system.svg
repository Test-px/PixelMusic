  <!-- Bullet Items in Rounded Component Box -->
  <g transform="translate(56, 132)">
    <rect x="0" y="0" width="808" height="106" rx="20" fill="#FFFFFF" stroke="#ECCBD9" stroke-width="1.2" opacity="0.9" />
    
      <g transform="translate(24, 26)">
        <!-- Scalloped mini bullet -->
        <circle cx="0" cy="0" r="4" fill="#4A2E46" />
        <text x="14" y="4" fill="#3B1E37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
