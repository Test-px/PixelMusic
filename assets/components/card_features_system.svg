        </text>
      </g>
    
      <g transform="translate(24, 74)">
        <!-- Scalloped mini bullet -->
        <circle cx="0" cy="0" r="4" fill="#4A2E46" />
        <text x="14" y="4" fill="#3B1E37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          <tspan font-weight="700">Car Dashboard Controls:</tspan> Certified Android Auto interface with safe touch targets and hands-free control.
