<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="🏝️ System Capsule &amp; OEM Islands">
  <defs>
    <linearGradient id="cardGrad_SystemIntegration" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8EBF3" />
      <stop offset="100%" stop-color="#ECCBD9" />
    </linearGradient>
  </defs>

  <!-- Big Component Container -->
  <rect x="2" y="2" width="916" height="256" rx="32" fill="url(#cardGrad_SystemIntegration)" stroke="#ECCBD9" stroke-width="1.8" />

  <!-- Scalloped Badge -->
  <g transform="translate(56, 52)">
    
    <g transform="translate(0, 0)">
      <rect x="-24" y="-24" width="48" height="48" rx="13.44" fill="#4A2E46" transform="rotate(0)" />
      <rect x="-24" y="-24" width="48" height="48" rx="13.44" fill="#4A2E46" transform="rotate(30)" />
      <rect x="-24" y="-24" width="48" height="48" rx="13.44" fill="#4A2E46" transform="rotate(60)" />
    </g>
  
    <!-- Sparkle / Star Icon -->
    <path d="M 0,-8 L 2.5,-2.5 L 8,0 L 2.5,2.5 L 0,8 L -2.5,2.5 L -8,0 L -2.5,-2.5 Z" fill="#F8EBF3" />
  </g>

  <!-- Header Section -->
  <g transform="translate(100, 38)">
    <text x="0" y="14" fill="#6B4B67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SYSTEM INTEGRATION</text>
    <text x="0" y="38" fill="#2E172B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">🏝️ System Capsule &amp; OEM Islands</text>
  </g>

  <!-- Expressive Spec Pills -->
  <g transform="translate(56, 88)">
    
