      <text x="77.5" y="18.5" fill="#2E172B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">Dynamic Island Capsule</text>
    </g>
  
    <g transform="translate(165, 0)">
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#FFFFFF" stroke="#ECCBD9" stroke-width="1.2" />
      <text x="77.5" y="18.5" fill="#2E172B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">Ambient Shazam Tile</text>
    </g>
  
    <g transform="translate(330, 0)">
