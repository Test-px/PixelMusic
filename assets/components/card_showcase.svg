  </g>

  <g transform="translate(104, 45)">
    <text x="0" y="16" fill="#EBBFE0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">INTERFACE GALLERY</text>
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">Material 3 Expressive Experience Showcase</text>
    <text x="0" y="68" fill="#F8EBF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" opacity="0.9">Dynamic color harmonies, GPU-accelerated AGSL scrims, and tactile spring motion.</text>
