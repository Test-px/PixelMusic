<svg xmlns="http://www.w3.org/2000/svg" width="920" height="130" viewBox="0 0 920 130" role="img" aria-label="App Showcase Header">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1429" />
      <stop offset="100%" stop-color="#3D1C39" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="916" height="126" rx="32" fill="url(#scBg)" stroke="#ECCBD9" stroke-width="1.8" />
  
  <g transform="translate(56, 65)">
    
    <g transform="translate(0, 0)">
      <rect x="-28" y="-28" width="56" height="56" rx="15.68" fill="#EBBFE0" transform="rotate(0)" />
      <rect x="-28" y="-28" width="56" height="56" rx="15.68" fill="#EBBFE0" transform="rotate(30)" />
      <rect x="-28" y="-28" width="56" height="56" rx="15.68" fill="#EBBFE0" transform="rotate(60)" />
    </g>
  
    <!-- Phone Device Icon -->
